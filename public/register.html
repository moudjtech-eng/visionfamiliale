<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>📄 Créer un compte</h1>
    <p class="muted">Gratuit. Tes CVs sont sauvegardés et accessibles partout.</p>

    <form id="register-form">
      <input type="email"    id="email"    placeholder="Email" required>
      <input type="password" id="password" placeholder="Mot de passe (6 caractères min.)" required minlength="6">
      <button type="submit" class="btn">Créer mon compte</button>
    </form>

    <p class="error" id="error"></p>

    <p class="switch">
      Déjà un compte ? <a href="/login.html">Se connecter</a>
    </p>
  </div>

  <script src="auth.js"></script>
<script>
  redirectIfLoggedIn();

  document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const errorEl = document.getElementById("error");
    errorEl.textContent = "";

    const res = await fetch("/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (!res.ok) { errorEl.textContent = "❌ " + data.error; return; }

    localStorage.setItem("pending_email", email);
    location.href = "/verify.html";
  });
</script>
</body>
</html>
